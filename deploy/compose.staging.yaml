name: londos-staging
x-runtime: &runtime
  image: ${LONDOS_IMAGE:?Set the verified release image by digest}
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 35s
  pids_limit: 128
  mem_limit: 768m
  cpus: 1
  tmpfs:
    - /tmp:mode=1777,size=64m
    - /app/.next/cache:uid=1000,gid=1000,mode=0700,size=64m
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
x-web: &web
  <<: *runtime
  command: [web]
  environment: &web-env
    DATABASE_URL_FILE: /run/secrets/web_database_url
    AUTH_SECRET_FILE: /run/secrets/auth_secret
    AUTH_BASE_URL: http://127.0.0.1:3200
    LONDOS_CORE_ENABLED: "true"
    LONDOS_LOCAL_ADAPTERS: "true"
    LONDOS_DATA_SOURCE: database
    LONDOS_AI_REMOTE: "false"
    LONDOS_PILOT_ANALYTICS: "false"
    LONDOS_PRIVACY_ERASURE: "false"
  secrets: [web_database_url, auth_secret]
  depends_on: { database: { condition: service_healthy } }
  healthcheck:
    test:
      [
        CMD,
        node,
        -e,
        "fetch('http://127.0.0.1:3000/api/ready').then(async r=>{const b=await r.json();if(!r.ok||!b.ready||!b.database||!b.authentication)process.exit(1)}).catch(()=>process.exit(1))",
      ]
    interval: 15s
    timeout: 6s
    retries: 3
    start_period: 30s
services:
  database:
    image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: londos_migrator
      POSTGRES_DB: londos_staging
      POSTGRES_PASSWORD_FILE: /run/secrets/migration_password
    secrets: [migration_password]
    volumes: [database:/var/lib/postgresql]
    shm_size: 256m
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: [CMD, pg_isready, -U, londos_migrator, -d, londos_staging]
      interval: 5s
      timeout: 3s
      retries: 10
  migration:
    <<: *runtime
    profiles: [bootstrap]
    restart: "no"
    command: [migrate]
    environment:
      DATABASE_URL_FILE: /run/secrets/migration_database_url
      LONDOS_RUNTIME_PASSWORDS_FILE: /run/secrets/runtime_passwords
    secrets: [migration_database_url, runtime_passwords]
    depends_on: { database: { condition: service_healthy } }
  web-a:
    <<: *web
    ports: ["127.0.0.1:3200:3000"]
  web-b:
    <<: *web
    ports: ["127.0.0.1:3201:3000"]
  worker:
    <<: *runtime
    command: [worker]
    environment:
      <<: *web-env
      DATABASE_URL_FILE: /run/secrets/worker_database_url
      LONDOS_WORKER_ID_FILE: /tmp/londos-worker-id
    secrets: [worker_database_url, auth_secret]
    volumes: [notifications:/app/.local/notifications]
    depends_on: { database: { condition: service_healthy } }
    healthcheck:
      test: [CMD, node, release-entry.mjs, worker-health]
      interval: 15s
      timeout: 6s
      retries: 3
  monitor:
    <<: *runtime
    profiles: [operations]
    restart: "no"
    command: [monitor]
    environment:
      DATABASE_URL_FILE: /run/secrets/monitor_database_url
      LONDOS_HEALTH_URL: http://web-a:3000/api/ready
      LONDOS_ALERT_RECIPIENT: ${LONDOS_ALERT_RECIPIENT:-unassigned}
    secrets: [monitor_database_url]
secrets:
  migration_database_url: { file: "${LONDOS_SECRETS_DIR}/migration-database-url" }
  runtime_passwords: { file: "${LONDOS_SECRETS_DIR}/runtime-passwords.json" }
  web_database_url:
    { file: "${LONDOS_SECRETS_DIR:?Set a protected secrets directory}/web-database-url" }
  worker_database_url: { file: "${LONDOS_SECRETS_DIR}/worker-database-url" }
  monitor_database_url: { file: "${LONDOS_SECRETS_DIR}/monitor-database-url" }
  auth_secret: { file: "${LONDOS_SECRETS_DIR}/auth-secret" }
  migration_password: { file: "${LONDOS_SECRETS_DIR}/migration-password" }
volumes:
  database:
  notifications:
