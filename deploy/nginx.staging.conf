# Loopback TLS/cache rehearsal. Production DNS/certificates are a separate gate.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 5m;
  server_tokens off;
  upstream londos_web { server web-a:3000; server web-b:3000; }
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/londos/tls.crt;
    ssl_certificate_key /etc/londos/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    location / {
      proxy_pass http://londos_web;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Londos-Client-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_cache off;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "private, no-store" always;
      add_header X-Content-Type-Options nosniff always;
    }
  }
}
