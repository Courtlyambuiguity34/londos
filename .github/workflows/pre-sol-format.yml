name: Pre-Sol one-shot formatter
on:
  push:
    branches:
      - codex/londos-pre-sol-completion-2026-10-07

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-pre-sol]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/londos-pre-sol-completion-2026-10-07
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - name: Format changed implementation files
        run: >
          npx prettier --write
          src/app/globals.css
          src/components/canonical-shop.tsx
          src/modules/ai-design/contract.ts
          src/modules/shop-design/specification.ts
          src/server/ai-design/provider-contract.ts
          src/server/ai-design/service.ts
          src/server/shop-design.ts
          tests/unit/ai-design.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/globals.css src/components/canonical-shop.tsx src/modules/ai-design/contract.ts src/modules/shop-design/specification.ts src/server/ai-design/provider-contract.ts src/server/ai-design/service.ts src/server/shop-design.ts tests/unit/ai-design.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "Format shop designer implementation"
            git push origin HEAD:codex/londos-pre-sol-completion-2026-10-07
          fi
